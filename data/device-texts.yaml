# Черновики текстов аппаратов со старого сайта (ТЗ, раздел 2). status: draft — до проверки врачом.
# Цены и «Где представлен» со старого сайта НЕ переносятся. Править здесь; врач меняет status на reviewed.
bbl:
  indications:
  - Лечение гиперпигментации (включая поствоспалительную и солнечную).
  - Коррекция сосудистых патологий (купероз, телеангиэктазии).
  - Терапия акне и розацеа в стадии ремиссии.
  - Общее фотоомоложение для улучшения текстуры кожи и сокращения пор.
  - Локальный термолифтинг (программа SkinTyte).
  principle: Аппарат BBL (BroadBand Light) — это широкополосная импульсная световая система. Его ключевое отличие — наличие двух активных ламп в манипуле и сапфирового кристалла для контактного охлаждения,
    что обеспечивает точный контроль глубины воздействия и высокий профиль безопасности. Технология основана на комбинации спектров видимого и инфракрасного света. Световая энергия избирательно поглощается
    мишенями в коже (меланин, оксигемоглобин), запуская процесс фотовоздействия, а инфракрасный компонент обеспечивает контролируемый прогрев для стимуляции неоколлагенеза.
  source: cosmetology.aldocoppola.ru — «BBL (Sciton, США)»
  status: draft
biogenie:
  indications:
  - Коррекция пастозности и отечности лица.
  - Улучшение тусклого, неровного цвета кожи.
  - Процедура экспресс-восстановления и тонизации (процедура «на выход»).
  - Уходовая поддержка для повышения эффективности домашнего ухода.
  principle: Методика основана на сочетанном воздействии низкочастотных микротоков и профессиональной косметики. Микротоки, имитирующие естественные биотоки организма, усиливают клеточный метаболизм, улучшают
    микроциркуляцию и способствуют активному транспорту ионов. Это создает условия для эффективного проведения активных компонентов сывороток вглубь тканей, выведения продуктов клеточного обмена (детокс)
    и дренажа избыточной межклеточной жидкости.
  source: cosmetology.aldocoppola.ru — «Biogenie (Франция)»
  status: draft
coolsculpting:
  indications:
  - Уменьшение локальных жировых отложений в области живота, фланков («боков»).
  - Коррекция зоны «голифе» на бедрах.
  - Устранение избыточных жировых прослоек в подбородочной области, на спине, руках.
  - Моделирование контуров тела без хирургического вмешательства.
  principle: Технология основана на научно доказанном явлении — апоптозе (запрограммированной гибели) адипоцитов, индуцированном холодовым воздействием. Специальный аппликатор создает контролируемое вакуумное
    втягивание складки кожи и жировой ткани с последующим ее охлаждением до точной температуры. Это приводит к кристаллизации липидов внутри жировых клеток без повреждения других тканей. В последующие 3
    месяца организм естественным путем элиминирует поврежденные адипоциты через лимфатическую систему.
  source: cosmetology.aldocoppola.ru — «CoolSculpting (Zeltiq, США)»
  status: draft
deka:
  indications:
  - Лазерная эпиляция на всех типах кожи и волос, включая загорелую кожу.
  - Удаление доброкачественной гиперпигментации (лентиго, веснушки) у клиентов I-II фототипов.
  principle: 'Принцип работы: Система оснащена александритовым лазером с длиной волны 755 нм, оптимальной для поглощения меланином. Запатентованная технология MOVE0 позволяет проводить обработку быстрыми
    непрерывными движениями манипулы, сокращая время процедуры. Лазерный луч избирательно нагревает волосяной матрикс и сосуды сосочка, коагулируя их. Встроенная система сапфирового охлаждения наконечника
    (+5°C) обеспечивает защиту эпидермиса. Для работы с пигментом используется сфокусированный луч с насадкой 3-10 мм.'
  source: cosmetology.aldocoppola.ru — «DEKA Motus AX (Италия)»
  status: draft
endospheres:
  indications:
  - Терапия целлюлита на различных стадиях.
  - Локальное уменьшение объемов за счет дренажа избыточной межклеточной жидкости.
  - Устранение пастозности и тяжести в ногах.
  - Неинвазивный лифтинг и моделирование контуров лица.
  principle: Аппарат Endospheres использует механическое воздействие на мягкие ткани без классического вакуума. В манипулах установлены 50 вращающихся силиконовых роликов сферической формы, которые создают
    эффект глубокой компрессионной вибрации. Это воздействие передается на подкожно-жировую клетчатку и мышечные структуры, способствуя разрушению фиброзных перегородок при целлюлите, усилению лимфотока
    и кровообращения. Для лица применяется отдельная манипула, воздействующая на поверхностные мышечные слои, что обеспечивает лифтинг-эффект и моделирование овала.
  source: cosmetology.aldocoppola.ru — «Endospheres (Италия)»
  status: draft
endymed:
  indications:
  - Фракционное микроигольчатое RF-омоложение лица, шеи, зоны декольте.
  - Лечение атрофических рубцов (включая постакне) и стрий.
  - RF-лифтинг тела для улучшения тонуса кожи и коррекции целлюлита.
  - Неинвазивная подтяжка кожи периорбитальной области и век.
  principle: Система Endymed Pro использует технологию 3DEEP, которая за счет особой конструкции электродов фокусирует радиочастотную (RF) энергию на заданной глубине, минимизируя рассеивание в верхних
    слоях кожи. В микроигольчатом режиме (насадка Intensif) позолоченные микроиглы доставляют RF-энергию точно в дермальный слой, создавая зоны микроповреждений для стимуляции ремоделинга коллагена. Безыгольные
    манипулы (Shaper, Small-RF) обеспечивают объемный прогрев для лифтинга и лечения целлюлита. Все насадки оснащены системой контактного охлаждения.
  source: cosmetology.aldocoppola.ru — «Endymed RF (Израиль)»
  status: draft
fotona:
  indications:
  - Многоуровневое лазерное омоложение лица и тела (протоколы 2D, 3D, 4D).
  - Лазерная блефаропластика (подтяжка век).
  - Лечение сосудистых патологий, акне, гиперпигментации.
  - Шлифовка кожи для коррекции рубцов и растяжек.
  - Удаление доброкачественных новообразований (папилломы, бородавки).
  principle: 'Платформа Fotona использует комбинацию двух лазеров: эрбиевого (длина волны 2940 нм) для аблятивного воздействия на поверхностные слои кожи и неодимового (1064 нм) для глубокого неаблятивного
    прогрева. Это позволяет проводить многоуровневые процедуры, такие как 4D-омоложение, воздействуя на разные слои кожи и слизистую. Система Cryo 6 обеспечивает бесконтактное динамическое охлаждение, повышая
    комфорт и снижая риски термического повреждения.'
  source: cosmetology.aldocoppola.ru — «Fotona (Словения) с системой Cryo 6 (Германия)»
  status: draft
friendly-light:
  indications:
  - Лечение купероза и телеангиэктазий.
  - Терапия акне и постакне.
  - Удаление бородавок и папиллом.
  - Лечение онихомикоза (грибка ногтей).
  principle: Аппарат Friendly Light оснащен неодимовым лазером (Nd:YAG, 1064 нм). Лазерный луч избирательно поглощается оксигемоглобином (в сосудах) и меланином (в пигментных и некоторых новообразованиях),
    вызывая коагуляцию целевых структур без повреждения окружающих тканей. Благодаря компактности и мобильности аппарат может оперативно доставляться в нужный центр.
  source: cosmetology.aldocoppola.ru — «Friendly Light (США)»
  status: draft
gezatone:
  indications:
  - Глубокая очистка кожи, удаление комедонов (черных точек).
  - Подготовка кожи к последующим уходовым или аппаратным процедурам.
  - Улучшение текстуры и тона кожи за счет мягкого пилинга.
  principle: Аппарат использует ультразвуковые колебания (частотой около 25-30 кГц), которые создают в жидкости эффект кавитации и микроструй. При контакте с кожей это обеспечивает механическое удаление
    загрязнений, избытка кожного сала и роговых чешуек с поверхности и из устьев пор. Ультразвук также усиливает проникновение активных веществ и улучшает микроциркуляцию.
  source: cosmetology.aldocoppola.ru — «Gezatone (Франция)»
  status: draft
harmony-xl:
  indications:
  - Лазерная эпиляция для всех фототипов.
  - Неабляционное лазерное омоложение (ClearLift).
  - Фракционное лазерное омоложение и шлифовка рубцов.
  - Лечение гиперпигментации и сосудистых патологий.
  principle: Платформа сочетает неодимовый и эрбиевый лазеры, а также технологию IPL (интенсивного импульсного света) в зависимости от установленной манипулы. Система оснащена эффективным охлаждением для
    комфорта пациента. Манипула HR Cooled предназначена для фотоэпиляции, ClearLift — для неабляционного омоложения неодимовым лазером, манипула 2940 — для эрбиевой шлифовки, VP — для фотоомоложения и работы
    с сосудами и пигментом.
  source: cosmetology.aldocoppola.ru — «Harmony XL (Alma Lasers, Израиль)»
  status: draft
hydrafacial:
  indications:
  - Глубокая, но щадящая чистка кожи, в том числе при акне.
  - Интенсивное увлажнение и улучшение текстуры кожи.
  - Антивозрастной уход, направленный на уменьшение морщин и улучшение тонуса.
  - Экспресс-восстановление сияния и гладкости кожи (процедура «на выход»).
  principle: 'Процедура выполняется на аппарате HydraFacial с использованием одноразовых насадок. Она включает этапы: механическое очищение алмазной насадкой, кислотный пилинг (салициловая и гликолевая
    кислоты), вакуумную экстракцию содержимого пор и, наконец, безыгольную инфузию коктейля сывороток на основе пептидов, антиоксидантов и гиалуроновой кислоты. Все этапы проводятся одной вакуумной манипуляцией,
    что обеспечивает последовательное и глубокое воздействие.'
  source: cosmetology.aldocoppola.ru — «HydraFacial (США)»
  status: draft
icoone:
  indications:
  - Формирование силуэта, антицеллюлитное действие, омоложение кожи, дренаж, укрепление, улучшение циркуляции крови, подтягивающий эффект, оздоровление и релаксация.
  principle: 'Аппарат icoone® обеспечивает глубокую и точную стимуляцию тканей. Результат заметен после первой процедуры. Устройство разработано с учётом эстетических и медицинских задач, действует мягко
    благодаря особой технологии. Стимуляция способствует выработке коллагена и насыщению тканей кислородом, улучшая их качество на длительный срок.

    Модель icoone® LASER сочетает три современных метода воздействия: стимуляцию, лазерную и светодиодную терапию. Это позволяет эффективно воздействовать на жировые отложения, не поддающиеся диете и физическим
    нагрузкам. Комбинация методов ускоряет достижение результата и продлевает его сохранение.

    Лазерное воздействие избирательно нагревает жировые клетки, способствуя их расщеплению. Светодиодная терапия стимулирует выработку коллагена и помогает высвобождать жир из клеток. Лазерная коррекция
    силуэта направлена на глубокие слои тканей и активирует процессы жиросжигания.'
  source: cosmetology.aldocoppola.ru — «ICOONE LASER (Италия)»
  status: draft
inmode-forma:
  indications: &id001
  - Фотоомоложение, лечение пигментации и сосудов (Lumecca).
  - Фракционное RF-омоложение, коррекция рубцов и морщин (Morpheus8).
  - Неинвазивный лифтинг и уплотнение кожи (Forma).
  principle: 'Платформа InMode сочетает три технологии: радиочастотную (RF), лазерную (диодный лазер) и IPL (интенсивный импульсный свет). В наших центрах представлены три манипулы: Lumecca (мощная IPL-система
    для фотоомоложения), Morpheus8 (микроигольчатая RF для фракционного омоложения) и Forma (неинвазивный RF-лифтинг). Morpheus8 доставляет RF-энергию через микроиглы в дерму, стимулируя неоколлагенез,
    а Forma обеспечивает объемный прогрев для подтяжки кожи.'
  source: cosmetology.aldocoppola.ru — «InMode (Израиль)»
  status: draft
inmode-lumecca:
  indications: *id001
  principle: 'Платформа InMode сочетает три технологии: радиочастотную (RF), лазерную (диодный лазер) и IPL (интенсивный импульсный свет). В наших центрах представлены три манипулы: Lumecca (мощная IPL-система
    для фотоомоложения), Morpheus8 (микроигольчатая RF для фракционного омоложения) и Forma (неинвазивный RF-лифтинг). Morpheus8 доставляет RF-энергию через микроиглы в дерму, стимулируя неоколлагенез,
    а Forma обеспечивает объемный прогрев для подтяжки кожи.'
  source: cosmetology.aldocoppola.ru — «InMode (Израиль)»
  status: draft
inmode-morpheus8:
  indications: *id001
  principle: 'Платформа InMode сочетает три технологии: радиочастотную (RF), лазерную (диодный лазер) и IPL (интенсивный импульсный свет). В наших центрах представлены три манипулы: Lumecca (мощная IPL-система
    для фотоомоложения), Morpheus8 (микроигольчатая RF для фракционного омоложения) и Forma (неинвазивный RF-лифтинг). Morpheus8 доставляет RF-энергию через микроиглы в дерму, стимулируя неоколлагенез,
    а Forma обеспечивает объемный прогрев для подтяжки кожи.'
  source: cosmetology.aldocoppola.ru — «InMode (Израиль)»
  status: draft
ksenonoterapiya:
  indications:
  - Седация и повышение комфорта пациента во время болезненных или длительных косметологических процедур (лазерные шлифовки, игольчатый RF).
  - Снятие тревожности и стресса перед вмешательством.
  - Вспомогательная терапия хронического болевого синдрома (мигрени).
  - Курсовое лечение для улучшения сна и восстановления после нагрузок.
  principle: Аппарат позволяет проводить ингаляцию точно дозированной смесью медицинского ксенона (Xe) и кислорода (O2). Ксенон, являясь инертным газом и антагонистом NMDA-рецепторов, обладает выраженным
    седативным, анксиолитическим (противотревожным) и легким анальгетическим действием, не угнетая дыхание. Процедура улучшает микроциркуляцию и оксигенацию тканей. Эффект наступает через 2-3 минуты от
    начала ингаляции и быстро проходит после ее окончания.
  source: cosmetology.aldocoppola.ru — «Ксенонотерапия (Россия)»
  status: draft
liftera-a:
  indications:
  - SMAS-лифтинг лица и шеи, коррекция возрастного птоза.
  - Устранение второго подбородка (субментальная зона).
  - Подтяжка области век и бровей.
  - Улучшение контуров тела и локальное уменьшение жировых отложений.
  principle: Аппарат генерирует микросфокусированные ультразвуковые волны, которые проникают на заданную глубину, создавая точки коагуляции (термические зоны повреждения) в слое SMAS (поверхностной мышечно-апоневротической
    системе), подкожной жировой клетчатке или дерме. Это вызывает контролируемую воспалительную реакцию и последующий неоколлагенез, обеспечивая эффект подтяжки. Насадка Pen Type позволяет работать в сложных
    анатомических областях (веки, носогубные складки).
  source: cosmetology.aldocoppola.ru — «Liftera-A (Южная Корея)»
  status: draft
lightsheer-duet:
  indications:
  - Лазерная эпиляция всех участков тела и лица для женщин и мужчин.
  - Удаление вросших волос.
  - Эффективен на всех типах кожи, включая загорелую.
  principle: Система оснащена диодным лазером с длиной волны 800 нм. Технология вакуумного усиления (Vacuum Assisted Technology) позволяет приподнимать кожу в зоне воздействия, сокращая расстояние между
    лазерным наконечником и волосяным фолликулом, а также временно обескровливая ткань. Это обеспечивает более глубокое и эффективное поглощение энергии меланином, снижает болевые ощущения и позволяет обрабатывать
    более обширные зоны за один проход.
  source: cosmetology.aldocoppola.ru — «LightSheer DUET (Lumenis, Израиль)»
  status: draft
lumicell-wave-6:
  indications:
  - Лечение целлюлита всех стадий.
  - Локальное уменьшение жировых отложений.
  - Подтяжка и улучшение качества кожи тела.
  - Реабилитация после липосакции, снятие отеков.
  - Устранение мышечных спазмов и болевого синдрома.
  principle: 'Аппарат последовательно использует пять методов воздействия: 1) вакуумно-роликовый массаж для улучшения микроциркуляции; 2) инфракрасный прогрев для размягчения жировой ткани; 3) ультразвуковую
    кавитацию для разрушения адипоцитов; 4) радиочастотный (RF) липолиз и лифтинг для подтяжки кожи; 5) безыгольную мезотерапию (электрофорез) для введения липолитических коктейлей. Такой комплексный подход
    обеспечивает синергетический эффект.'
  source: cosmetology.aldocoppola.ru — «LumiCell Wave 6 (Канада)»
  status: draft
mantis:
  indications:
  - Коррекция фигуры, уменьшение объемов.
  - Лечение целлюлита и «апельсиновой корки».
  - Устранение отечности тканей.
  - Реабилитация и снятие болевого синдрома при патологиях опорно-двигательного аппарата.
  principle: Аппарат объединяет две технологии. Эндомассаж MRM — это вакуумно-роликовый массаж, который интенсивно разминает ткани, улучшает дренаж и оказывает «шоковое» воздействие на жировые клетки. Технология
    CMPS использует импульсные магнитные поля низкой частоты, которые стимулируют фибробласты, улучшают микроциркуляцию и тонус соединительной ткани. Совместное применение усиливает лимфодренаж, уменьшает
    объемы и оказывает обезболивающий эффект.
  source: cosmetology.aldocoppola.ru — «Mantis (Италия)»
  status: draft
maximus:
  indications:
  - Устранение дряблости кожи и локальных жировых отложений на теле.
  - Лечение целлюлита.
  - Улучшение тонуса и рельефа мышц без физических нагрузок.
  - Лифтинг кожи лица, шеи, зоны декольте.
  principle: 'Технология TriLipo® одновременно задействует три процесса: радиочастотный нагрев ткаей (TriPollar®), динамическую миостимуляцию (DMA) и их совместное воздействие. RF-энергия обеспечивает глубокий
    и равномерный прогрев, стимулируя выработку коллагена и липолиз. DMA вызывает интенсивные мышечные сокращения, тренируя и подтягивая мускулатуру. Совместное воздействие приводит к активному расщеплению
    жиров и выраженному лифтинг-эффекту.'
  source: cosmetology.aldocoppola.ru — «Maximus (Израиль)»
  status: draft
medozons:
  indications:
  - Лечение воспалительных форм акне.
  - Терапия целлюлита.
  - Мезотерапевтическое омоложение и улучшение цвета лица.
  - Общая озонотерапия для детоксикации и повышения тонуса.
  - Лечение андрогенетической алопеции и улучшение состояния волос.
  principle: 'Аппарат генерирует медицинский озон (O3) из медицинского кислорода. Озон обладает мощным бактерицидным, противовоспалительным и кислорододонационным действием. Применяется тремя основными
    способами: 1) инъекционно (подкожно/внутрикожно) для лечения целлюлита, акне и омоложения кожи; 2) методом «озоновой капельницы» (внутривенное введение озонированного физиологического раствора) для
    общего детокса и укрепления иммунитета; 3) инъекционно в волосистую часть головы для лечения выпадения волос.'
  source: cosmetology.aldocoppola.ru — «Medozons (Россия)»
  status: draft
mermaid:
  indications:
  - Карбоновый пилинг для глубокого очищения, лечения акне и сужения пор.
  - Фракционное лазерное омоложение для улучшения текстуры и тонуса кожи.
  - Удаление доброкачественной гиперпигментации (лентиго, веснушки).
  - Выравнивание цвета лица и придание матовости жирной коже.
  principle: Аппарат использует неодимовый лазер с длиной волны 1064 нм. Для разных задач применяются сменные линзы. Карбоновый пилинг проводится путем нанесения наногеля с частицами углерода и последующего
    лазерного воздействия, что приводит к фотоакустическому эффекту и глубокому очищению пор. Фракционное омоложение осуществляется через запатентованную фракционную линзу, создающую в дерме термоколонны
    для стимуляции коллагена без повреждения эпидермиса. Для лечения пигментации используется сфокусированный луч для селективного фототермолиза меланина.
  source: cosmetology.aldocoppola.ru — «MERMAID (Южная Корея)»
  status: draft
scarlet-rf:
  indications:
  - Глубокое омоложение и подтяжка кожи лица, шеи, век.
  - Лечение атрофических рубцов и стрий.
  - Улучшение качества и упругости кожи тела.
  - Стимуляция роста волос (трихологический режим).
  principle: Система использует технологию фракционного радиочастотного воздействия через позолоченные микроиглы. Иглы диаметром 0,3 мм проникают на заданную глубину, и при контакте их кончиков с дермой
    подается RF-энергия. Это создает контролируемые микроповреждения в глубоких слоях, минуя эпидермис, что минимизирует реабилитацию. Процедура стимулирует активный синтез нового коллагена, эластина и
    гиалуроновой кислоты. На минимальных настройках применяется для стимуляции роста волос.
  source: cosmetology.aldocoppola.ru — «Scarlet RF (Южная Корея)»
  status: draft
skin-master:
  indications:
  - Гигиеническая и лечебная чистка лица всех типов.
  - Ультразвуковой пилинг для обновления кожи.
  - Подготовка кожи к последующим косметологическим процедурам.
  - Курсовое лечение постакне и легкой гиперпигментации.
  principle: Основная используемая насадка — ультразвуковая, генерирующая продольные и поперечные волны. Колебания высокой частоты создают эффект «кавитации» на поверхности кожи, что приводит к отшелушиванию
    рогового слоя, разрушению сально-роговых пробок (комедонов) и мягкому массажу. Ультразвук также усиливает проникновение активных компонентов и улучшает микроциркуляцию. Аппарат оснащен функцией «Cleaning»
    для работы с гиперпигментацией.
  source: cosmetology.aldocoppola.ru — «Skin Master (Италия)»
  status: draft
soprano:
  indications:
  - Лазерная эпиляция для всех фототипов кожи и цветов волос.
  - Терапия болевого синдрома (миалгии, артралгии) в области спины, шеи, суставов.
  principle: 'Аппарат использует два типа излучения: диодное (800 нм) и александритовое (755 нм), что позволяет эффективно работать с разными типами волос и кожи. Технология ICE обеспечивает непрерывное
    контактное охлаждение кожи сапфировым наконечником до -4°C, что значительно повышает комфорт и безопасность. Методика «в движении» позволяет быстро обрабатывать большие площади. Дополнительная насадка
    NIR использует инфракрасное излучение для глубокого прогрева тканей и снятия мышечно-суставных болей.'
  source: cosmetology.aldocoppola.ru — «Soprano ICE (Alma Lasers, Израиль)»
  status: draft
ulfit:
  indications:
  - Уменьшение локальных жировых отложений на животе, боках, бедрах, ягодицах.
  - Устранение проявлений целлюлита.
  - Лифтинг и повышение упругости кожи тела.
  - Коррекция дряблости кожи после снижения веса.
  principle: Аппарат генерирует микросфокусированные ультразвуковые волны высокой интенсивности, которые фокусируются на заданной глубине в подкожно-жировой клетчатке. Каждый импульс создает точку коагуляции
    (термического некроза) в жировой ткани, не повреждая окружающие структуры. Последующая воспалительная реакция и процесс заживления приводят к лизису и выведению адипоцитов, а также стимуляции неоколлагенеза
    в дерме, что обеспечивает эффект уменьшения объема и подтяжки кожи.
  source: cosmetology.aldocoppola.ru — «Ulfit (Classys, Южная Корея)»
  status: draft
ultraformer:
  indications:
  - Глубокий лифтинг лица, шеи и зоны декольте за счет воздействия на SMAS-слой.
  - Подтяжка овала лица, коррекция брылей, второго подбородка.
  - Уменьшение грыж и мешков под глазами.
  - Неинвазивная коррекция локальных жировых отложений на теле.
  principle: Технология основана на способности ультразвуковых волн фокусироваться в заданной точке под кожей, создавая точные зоны термического воздействия (коагуляционные некрозы). В зависимости от типа
    насадки и глубины фокусировки, аппарат может воздействовать на слой SMAS, подкожно-жировую клетчатку или дерму. Нагрев тканей до 60-70°C вызывает немедленное сокращение коллагеновых волокон и запускает
    длительный процесс неоколлагенеза, обеспечивая выраженный лифтинг-эффект.
  source: cosmetology.aldocoppola.ru — «Ultraformer (Classys, Южная Корея)»
  status: draft
vip-line:
  indications:
  - Формирование мышечного рельефа (пресс, ягодицы, бедра) без физических нагрузок.
  - Пассивная «тренировка» мышц для повышения тонуса.
  - Уменьшение объемов тела за счет дренажа избыточной межклеточной жидкости.
  - Коррекция дряблости кожи и улучшение ее текстуры.
  principle: Аппарат посылает низкочастотные электрические импульсы через накожные электроды, вызывая интенсивные непроизвольные сокращения мышечных волокон. Программа Transion реализует торсионное (скручивающее)
    сокращение, максимально напоминающее естественную нагрузку. Одновременно это воздействие усиливает локальный метаболизм и лимфодренаж. Программа Isogel направлена на укрепление и формирование рельефа
    мышц, а Microgel — на микротоковую терапию лица.
  source: cosmetology.aldocoppola.ru — «VipLine (Италия)»
  status: draft
