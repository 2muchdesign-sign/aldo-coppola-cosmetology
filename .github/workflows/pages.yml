# Сборка Astro → dist/ и публикация превью на GitHub Pages (ТЗ, раздел 12).
# Каталог (data/catalog.json) и обработанные медиа (public/media) собираются локально и лежат в репозитории.
name: Deploy preview to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts   # ffmpeg/sharp не нужны для сборки страниц
      - run: npx astro build
        env:
          BASE_PATH: /aldo-coppola-cosmetology/
          SITE_URL: https://2muchdesign-sign.github.io
      - run: node scripts/check-site.mjs && node scripts/test-search.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
